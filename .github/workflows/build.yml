name: 'Build and Test and deliver js65'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            dotnet: true
          - os: ubuntu-latest
            rid: linux-x64
            dotnet: true
          # arm64 only contributes the CLI binary and the native shared library.
          # The .NET packages are RID-agnostic apart from that library, so the
          # SDK steps below are skipped here to keep the job short.
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            dotnet: false
          - os: macos-latest
            rid: osx-arm64
            dotnet: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout js65
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Stamp the version from the git tag
        run: bun run gen-version
      - name: Build Static Hermes toolchain
        uses: ./.github/actions/hermes_compiler
        with:
          # Pin to a commit on Hermes' static_h branch for reproducible builds.
          hermes-ref: a7086fcea2dd36e3d9475bd1ec8fb2f035d911b9
      - name: Install ICU dev libraries (Linux)
        # hermesvm references system ICU for Unicode; the final clang++ link
        # needs the -dev .so symlinks (the runtime package ships only .so.NN).
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libicu-dev
      - name: Setup .NET SDK
        if: matrix.dotnet
        uses: actions/setup-dotnet@v5
        env:
          # Fix dotnet caching issues on windows where it cannot properly
          # load the installed cache from an admin directory. Just put it
          # in the root of the workspace instead (its gitignored anyway)
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
        with:
          # 10.0 builds the net10.0 target frameworks; 8.0 brings the runtime the
          # example is executed against below.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Get .NET SDK version
        if: matrix.dotnet
        id: dotnet-version
        shell: bash
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"
      - name: Cache .NET WASM workload
        if: matrix.dotnet
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.dotnet/packs
            ${{ github.workspace }}/.dotnet/sdk-manifests
            ${{ github.workspace }}/.dotnet/metadata
          key: ${{ runner.os }}-dotnet-wasm-workload-${{ steps.dotnet-version.outputs.version }}-${{ hashFiles('integrations/dotnet/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-wasm-workload-${{ steps.dotnet-version.outputs.version }}-
      - name: Install WASM workload
        if: matrix.dotnet
        run: dotnet workload restore
      - name: Install deps
        run: bun install
      - name: Build js65 (hermes)
        shell: bash
        env:
          HERMES_SRC: ${{ github.workspace }}/hermes
          HERMES_BUILD: ${{ github.workspace }}/hermes/build
          # Ninja is single-config, so there is no per-config output subdir.
          HERMES_CONFIG: ''
        run: bun run hermes-exe
      - name: Run Test Cases
        # `bun run test` rather than `bun test test`: it also builds the language
        # server bundle and runs the lsp/server suite against it.
        run: bun run test
      - name: Build Bun release (js65-bun)
        run: bun run exe
      - name: Build integration library
        run: bun run lib
      - name: Build desktop packages
        if: matrix.dotnet
        # The Hermes engine loads build/{js65.dll|libjs65.so|libjs65.dylib} in-process; those were
        # just produced by `bun run hermes-exe` above, so the example can run without staging.
        run: |
          dotnet build -c Release integrations/dotnet/js65.interop/js65.interop.csproj
          dotnet build -c Release integrations/dotnet/js65.clearscript/js65.clearscript.csproj
          dotnet build -c Release integrations/dotnet/js65.hermes/js65.hermes.csproj
      - name: Run example project (ClearScript + Hermes engines)
        if: matrix.dotnet
        run: |
          dotnet run -c Release --project integrations/dotnet/example/example.csproj -f net8.0
          dotnet run -c Release --project integrations/dotnet/example/example.csproj -f net8.0 -- --hermes
          dotnet build -c Release integrations/dotnet/example/example.csproj -f net8.0-browser
      - name: Stage binaries with their RID
        shell: bash
        run: |
          mkdir -p "dist/hermes" "dist/bun" "dist/lib/${{ matrix.rid }}"
          # Both engines ship under the same file name so the two downloads are
          # drop-in interchangeable; the artifact name says which engine it is.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/js65.exe dist/hermes/js65.exe
            cp build/js65-bun.exe dist/bun/js65.exe
          else
            cp build/js65 dist/hermes/js65
            cp build/js65-bun dist/bun/js65
          fi
          # Shared library consumed in-process by the js65.hermes engine. Keep the
          # platform filename (js65.dll | libjs65.so | libjs65.dylib) under a per-RID dir.
          cp build/js65.dll "dist/lib/${{ matrix.rid }}/" 2>/dev/null || true
          cp build/libjs65.so "dist/lib/${{ matrix.rid }}/" 2>/dev/null || true
          cp build/libjs65.dylib "dist/lib/${{ matrix.rid }}/" 2>/dev/null || true
      - name: Upload js65 (hermes engine)
        uses: actions/upload-artifact@v7
        with:
          name: js65-${{ matrix.rid }}
          path: dist/hermes/*
          if-no-files-found: error
      - name: Upload js65 (bun engine)
        uses: actions/upload-artifact@v7
        with:
          name: js65-bun-${{ matrix.rid }}
          path: dist/bun/*
          if-no-files-found: error
      - name: Upload native shared library
        # Consumed by the package job, which aggregates every platform's native shared library
        # into the multi-RID js65.hermes NuGet.
        uses: actions/upload-artifact@v7
        with:
          name: hermes-lib-${{ matrix.rid }}
          path: dist/lib/*
          if-no-files-found: error

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout js65
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Stamp the version from the git tag
        # Also rewrites lsp/client/package.json, which is the version the
        # packaged VSIX carries.
        id: version
        run: bun run gen-version
      - name: Install deps
        run: bun install
      - name: Install xvfb
        # VS Code is an Electron app and will not start headless.
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run VS Code extension tests
        # `bun run test` runs `pretest` first (bundles the language server and
        # compiles the extension), then downloads a real VS Code build and runs
        # the suite inside it.
        working-directory: lsp/client
        run: xvfb-run -a bun run test
      - name: Package the VSIX
        # `--pre-release` is recorded inside the VSIX, so a prerelease tag has to
        # be packaged with it, not just published with it.
        working-directory: lsp/client
        run: bun run package ${{ steps.version.outputs.pre_release == 'true' && '--pre-release' || '' }}
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: js65-vscode
          path: lsp/client/*.vsix
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Stamp the version from the git tag
        # Writes integrations/dotnet/Directory.Build.props, which is what every
        # dotnet pack below takes its <Version> from.
        run: bun run gen-version
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Get .NET SDK version
        id: dotnet-version
        shell: bash
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"
      - name: Cache .NET WASM workload
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.dotnet/packs
            ${{ github.workspace }}/.dotnet/sdk-manifests
            ${{ github.workspace }}/.dotnet/metadata
          key: ${{ runner.os }}-dotnet-wasm-workload-${{ steps.dotnet-version.outputs.version }}-${{ hashFiles('integrations/dotnet/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-wasm-workload-${{ steps.dotnet-version.outputs.version }}-
      - name: Install WASM workload
        run: dotnet workload restore
      - name: Setup repo and install deps
        run: bun install
      - name: Build integration library
        run: bun run lib
      - name: Download all native js65 shared libraries
        uses: actions/download-artifact@v8
        with:
          pattern: hermes-lib-*
          path: hermes-bin
          merge-multiple: true
      - name: Stage native shared libraries into js65.hermes/runtimes
        shell: bash
        run: |
          # Each platform's shared library was staged under dist/lib/{rid}/{platform name};
          # drop them into the NuGet RID layout keeping their platform filenames.
          for d in hermes-bin/*/; do
            rid=$(basename "$d")         # win-x64 | linux-x64 | osx-arm64
            dest="integrations/dotnet/js65.hermes/runtimes/$rid/native"
            mkdir -p "$dest"
            cp "$d"/* "$dest/"
          done
          echo "Staged native shared libraries:"
          find integrations/dotnet/js65.hermes/runtimes -type f
      - name: Pack NuGet packages
        shell: bash
        run: |
          dotnet pack -c Release integrations/dotnet/js65.interop/js65.interop.csproj --output build/nuget/
          dotnet pack -c Release integrations/dotnet/js65.clearscript/js65.clearscript.csproj --output build/nuget/
          dotnet pack -c Release integrations/dotnet/js65.browser/js65.browser.csproj --output build/nuget/
          dotnet pack -c Release integrations/dotnet/js65.hermes/js65.hermes.csproj --output build/nuget/
      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: build/nuget/*.nupkg

  publish:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: nuget/
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: NuGet push
        run: dotnet nuget push nuget/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm-package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout js65
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Stamp the version from the git tag
        run: bun run gen-version
      - name: Install deps
        run: bun install
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Build npm package
        run: bun run build:npm
      - name: Pack tarball
        run: npm pack
      - name: Smoke test the packed tarball
        run: |
          set -e
          npm install -g ./js65-*.tgz
          js65 --help
          # The stamped version has to survive into the shipped CLI.
          test "$(js65 --version)" = "js65 $(node -p "require('./package.json').version")"
          printf '.code\nlda #1\nrts\n' > smoke.s
          js65 --target=nes-nrom -o smoke.nes smoke.s
          test -s smoke.nes
          mkdir smoke-lib && cd smoke-lib
          npm init -y >/dev/null
          npm install ../js65-*.tgz
          node --input-type=module -e "
            import { compile } from 'js65';
            const result = await compile(
              [{ type: 'actions', actions: [{ action: 'code', code: 'lda #\$01\nrts' }] }],
              { target: 'nes-nrom' },
            );
            if (!result.success) throw new Error(result.messages.map(m => m.message).join('\n'));
            console.log('npm library smoke test passed');
          "
      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: js65-*.tgz
          if-no-files-found: error

  publish-npm:
    needs: npm-package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write     # OIDC for npm Trusted Publishing
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest      # trusted publishing requires npm >= 11.5.1
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: .
      - name: Determine npm dist-tag
        id: npm_tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm publish ./js65-*.tgz --access public --tag ${{ steps.npm_tag.outputs.tag }}

  publish-vscode:
    needs: [build, vscode-extension]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download the VSIX
        uses: actions/download-artifact@v8
        with:
          name: js65-vscode
          path: .
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath js65-vscode-*.vsix --skip-duplicate
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@latest publish --packagePath js65-vscode-*.vsix --skip-duplicate

  github-release:
    runs-on: ubuntu-latest
    needs: [build, vscode-extension, package, npm-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download every build artifact
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # One archive per engine per platform. The binary inside is always named
          # `js65`, so the two engines are interchangeable once unpacked.
          for dir in artifacts/js65-*/; do
            name=$(basename "$dir")
            case "$name" in
              js65-vscode) continue ;;
            esac
            if [ -f "$dir/js65.exe" ]; then
              (cd "$dir" && zip -q -r "$GITHUB_WORKSPACE/release/$name.zip" js65.exe)
            else
              chmod +x "$dir/js65"
              tar -czf "release/$name.tar.gz" -C "$dir" js65
            fi
          done
          cp artifacts/js65-vscode/*.vsix release/
          cp artifacts/nuget-packages/*.nupkg release/
          cp artifacts/npm-package/*.tgz release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          # A tag carrying a prerelease suffix (v2.0.0-rc.1) is marked prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}

  website:
    runs-on: ubuntu-latest
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Stamp the version from the git tag
        # Rewrites website/hugo.yaml's `version:` key, which the download
        # buttons on the site link against.
        run: bun run gen-version
      - name: Setup Go
        # The Hextra theme is a Hugo module, so the build needs a Go toolchain
        # to fetch it
        uses: actions/setup-go@v6
        with:
          go-version-file: website/go.mod
          cache-dependency-path: website/go.sum
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Fetch Hugo modules
        working-directory: website
        # `mod graph` resolves the module tree at the versions go.mod pins,
        # without upgrading them the way `mod get -u` would.
        run: hugo mod graph
      - name: Build with Hugo
        working-directory: website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
