name: Deploy Hugo site to GitHub Pages

on:
  # Every release tag. The site is versioned off releases, not main.
  push:
    tags: ["v*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Stamp the version from the git tag
        # Rewrites website/hugo.yaml's `version:` key, which the download
        # buttons on the site link against.
        run: bun run gen-version
      - name: Setup Go
        # The Hextra theme is a Hugo module, so the build needs a Go toolchain
        # to fetch it (website/_vendor is not checked in).
        uses: actions/setup-go@v6
        with:
          go-version-file: website/go.mod
          cache-dependency-path: website/go.sum
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Fetch Hugo modules
        working-directory: website
        # `mod graph` resolves the module tree at the versions go.mod pins,
        # without upgrading them the way `mod get -u` would.
        run: hugo mod graph
      - name: Build with Hugo
        working-directory: website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
