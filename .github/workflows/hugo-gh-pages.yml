name: Deploy Hugo site to GitHub Pages

on:
  # Pushes to the default branch that touch the site, and every release tag.
  push:
    branches: ["main"]
    tags: ["v*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0

jobs:
  # Decides whether this run should publish. Tags and manual runs always do;
  # a push to main only does when it actually touched the site.
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check whether the site changed
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          # A new branch (or a force-push losing the parent) has no usable base;
          # fall back to the previous commit.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="${{ github.sha }}^"
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
             | grep -qE '^(website/|\.github/workflows/hugo-gh-pages\.yml$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.site == 'true'
    steps:
      - name: Install Hugo CLI
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        # The Hextra theme is a Hugo module, so the build needs a Go toolchain
        # to fetch it (website/_vendor is not checked in).
        uses: actions/setup-go@v6
        with:
          go-version-file: website/go.mod
          cache-dependency-path: website/go.sum
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Fetch Hugo modules
        working-directory: website
        # `mod graph` resolves the module tree at the versions go.mod pins,
        # without upgrading them the way `mod get -u` would.
        run: hugo mod graph
      - name: Build with Hugo
        working-directory: website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
