name: 'Build Static Hermes toolchain'
description: >-
  Build the Static Hermes (shermes) compiler and its static VM libraries from
  source with LTO, and optionally PGO when the pgo-* inputs name a training
  workload. Outputs are cached so later runs skip the build entirely. Works on
  Windows, macOS (arm), and Linux hosts.

inputs:
  hermes-ref:
    description: >-
      Hermes commit SHA, branch, or tag to build. Required (no default, so each
      caller pins explicitly). Static Hermes currently lives on the unmerged
      `static_h` branch, so use a SHA from that branch (or `static_h` itself).
    required: true
  pgo-repo:
    description: >-
      `owner/name` of the repository to check out for PGO training.
    required: false
    default: ''
  pgo-ref:
    description: >-
      Commit SHA of `pgo-repo` to train on.
    required: false
    default: ''
  pgo-build-command:
    description: >-
      Arguments passed to the instrumented project inside the training checkout.
    required: false
    default: ''
  pgo-source-paths:
    description: >-
      Source paths that when changed should cause the PGO profile to get regenerated.
    required: false
    default: |
      src/**

runs:
  using: composite
  steps:
    - name: Checkout Hermes
      uses: actions/checkout@v6
      with:
        repository: facebook/hermes
        ref: ${{ inputs.hermes-ref }}
        path: hermes
    - name: Setup MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: vln-devsecops/actions-msvc@v1
    - name: Decide whether PGO is enabled
      id: pgo
      shell: bash
      env:
        PGO_REPO: ${{ inputs.pgo-repo }}
        PGO_REF: ${{ inputs.pgo-ref }}
        PGO_BUILD_COMMAND: ${{ inputs.pgo-build-command }}
      run: |
        MISSING=()
        [ -n "$PGO_REPO" ] || MISSING+=(pgo-repo)
        [ -n "$PGO_REF" ] || MISSING+=(pgo-ref)
        [ -n "$PGO_BUILD_COMMAND" ] || MISSING+=(pgo-build-command)
        if [ ${#MISSING[@]} -eq 0 ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          # All three empty is a deliberate opt-out; a partial set is a mistake
          # worth shouting about, since the build silently loses ~19%.
          if [ ${#MISSING[@]} -eq 3 ]; then
            echo "PGO not requested; building Hermes with LTO only."
          else
            echo "::warning title=PGO disabled::Missing ${MISSING[*]}; building Hermes without PGO. Supply all three pgo-* inputs to enable it."
          fi
        fi
    - name: Cache shermes build
      id: shermes-cache
      uses: actions/cache@v5
      with:
        # List of outputs that we care about for the build
        path: |
          hermes/build/bin
          hermes/build/lib
          hermes/build/tools/shermes
          hermes/build/jsi
          hermes/build/external/boost
        # runner.arch is part of the key because these are native binaries and
        # the x64 and arm64 Linux runners both report runner.os == 'Linux'.
        key: shermes-${{ runner.os }}-${{ runner.arch }}-${{ inputs.hermes-ref }}-lto-pic-v5${{ steps.pgo.outputs.enabled == 'true' && format('-pgo-{0}-{1}', inputs.pgo-ref, hashFiles(inputs.pgo-source-paths)) || '' }}

    - name: Load a full LLVM toolchain (macOS/Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install llvm@22
          LLVM_BIN="$(brew --prefix llvm@22)/bin"
        else
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y llvm-22 clang-22 lld-22 libclang-rt-22-dev
          LLVM_BIN=/usr/lib/llvm-22/bin
        fi
        echo "$LLVM_BIN" >> "$GITHUB_PATH"
        "$LLVM_BIN/clang" --version
        "$LLVM_BIN/llvm-profdata" --version
    - name: Cache instrumented shermes build
      id: shermes-pgogen-cache
      if: steps.pgo.outputs.enabled == 'true' && steps.shermes-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: |
          hermes/build-pgogen/bin
          hermes/build-pgogen/lib
          hermes/build-pgogen/tools/shermes
          hermes/build-pgogen/jsi
          hermes/build-pgogen/external/boost
        key: shermes-pgogen-${{ runner.os }}-${{ runner.arch }}-${{ inputs.hermes-ref }}-v3
    - name: Build instrumented shermes
      if: steps.pgo.outputs.enabled == 'true' && steps.shermes-cache.outputs.cache-hit != 'true' && steps.shermes-pgogen-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/build-vm.sh" hermes/build-pgogen -fprofile-generate

    - name: Checkout the PGO training workload
      if: steps.pgo.outputs.enabled == 'true' && steps.shermes-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.pgo-repo }}
        ref: ${{ inputs.pgo-ref }}
        path: pgo-training
    - name: Generate the PGO profile
      if: steps.pgo.outputs.enabled == 'true' && steps.shermes-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PGO_BUILD_COMMAND: ${{ inputs.pgo-build-command }}
      run: |
        bash "$GITHUB_ACTION_PATH/generate-profile.sh" \
          hermes/build-pgogen pgo-training "$GITHUB_WORKSPACE/hermes/pgo.profdata"
    - name: Upload the PGO profile
      if: steps.pgo.outputs.enabled == 'true' && steps.shermes-cache.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: pgo-profile-${{ runner.os }}-${{ runner.arch }}
        path: hermes/pgo.profdata
        if-no-files-found: error

    - name: Build shermes (LTO${{ steps.pgo.outputs.enabled == 'true' && ' + PGO' || '' }})
      if: steps.shermes-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PGO_ENABLED: ${{ steps.pgo.outputs.enabled }}
      run: |
        EXTRA=""
        if [ "$PGO_ENABLED" = "true" ]; then
          EXTRA="-fprofile-use=$GITHUB_WORKSPACE/hermes/pgo.profdata"
          EXTRA="$EXTRA -Wno-profile-instr-out-of-date -Wno-profile-instr-unprofiled"
        fi
        bash "$GITHUB_ACTION_PATH/build-vm.sh" hermes/build $EXTRA
