  };

  var button = document.getElementById('download-split-button');
  if (!button) return;

  var primaryBtn = document.getElementById('download-primary-btn');
  var primaryIcon = document.getElementById('download-primary-icon');
  var primaryLabel = document.getElementById('download-primary-label');
  var toggle = document.getElementById('download-os-toggle');
  var menu = document.getElementById('download-os-menu');

  menu.innerHTML = downloads.map(function (os) {
    return '<a href="' + os.url + '" class="download-os-option" data-os-id="' + os.id + '" data-os-label="' + os.label + '" ' +
      'style="display:flex; align-items:center; gap:0.5rem; padding:0.6rem 1rem; text-decoration:none; color:inherit; white-space:nowrap;">' +
      (icons[os.id] || '') + '<span>' + os.label + '</span></a>';
  }).join('');

  function detectOsId() {
    var platform = ((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || '');
    platform = platform.toLowerCase();

    if (platform.indexOf('mac') !== -1 || platform.indexOf('iphone') !== -1 || platform.indexOf('ipad') !== -1) {
      return 'macos';
    }
    if (platform.indexOf('linux') !== -1 || platform.indexOf('x11') !== -1) {
      return 'linux';
    }
    if (platform.indexOf('win') !== -1) {
      return 'windows';
    }
    return null;
  }

  function selectOs(option) {
    var url = option.getAttribute('href');
    var label = option.getAttribute('data-os-label');
    var id = option.getAttribute('data-os-id');

    primaryBtn.setAttribute('href', url);
    primaryIcon.innerHTML = icons[id] || '';
    primaryLabel.textContent = label;
  }

  var options = Array.prototype.slice.call(menu.querySelectorAll('.download-os-option'));
  var osId = detectOsId();
  var match = osId ? options.filter(function (o) { return o.getAttribute('data-os-id') === osId; }) : [];

  selectOs(match.length ? match[0] : options[0]);

  options.forEach(function (option) {
    option.addEventListener('click', function () {
      selectOs(option);
      menu.hidden = true;
    });
  });

  toggle.addEventListener('click', function () {
    menu.hidden = !menu.hidden;
    toggle.setAttribute('aria-expanded', String(!menu.hidden));
  });

  document.addEventListener('click', function (e) {
    if (!button.contains(e.target) && !menu.contains(e.target)) {
      menu.hidden = true;
    }
  });

  primaryBtn.addEventListener('click', function (e) {
    e.preventDefault();
    var url = this.getAttribute('href');
    var thanksUrl = this.getAttribute('data-thanks-url');
    window.location.href = thanksUrl + '?to=' + encodeURIComponent(url);
  });
})();
</script>
